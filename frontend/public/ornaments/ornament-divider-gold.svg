<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 32" fill="none" preserveAspectRatio="xMidYMid meet">
  <!-- Central Diamond -->
  <rect x="146" y="12" width="8" height="8" transform="rotate(45 150 16)" fill="#C7A15A" />
  <!-- Secondary Accents -->
  <circle cx="132" cy="16" r="2" fill="#B88A3D" />
  <circle cx="168" cy="16" r="2" fill="#B88A3D" />
  <!-- Left flourish line -->
  <path d="M10 16 H 122" stroke="url(#goldGradientLeft)" stroke-width="1" stroke-linecap="round" />
  <!-- Right flourish line -->
  <path d="M178 16 H 290" stroke="url(#goldGradientRight)" stroke-width="1" stroke-linecap="round" />
  <!-- Petal flourishes -->
  <path d="M140 16 C 144 11, 146 11, 150 7 C 154 11, 156 11, 160 16" stroke="#C7A15A" stroke-width="1.2" fill="none" stroke-linecap="round" />
  <path d="M140 16 C 144 21, 146 21, 150 25 C 154 21, 156 21, 160 16" stroke="#C7A15A" stroke-width="1.2" fill="none" stroke-linecap="round" />
  <defs>
    <linearGradient id="goldGradientLeft" x1="10" y1="16" x2="122" y2="16" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C7A15A" stop-opacity="0" />
      <stop offset="0.6" stop-color="#C7A15A" stop-opacity="0.8" />
      <stop offset="1" stop-color="#B88A3D" />
    </linearGradient>
    <linearGradient id="goldGradientRight" x1="178" y1="16" x2="290" y2="16" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B88A3D" />
      <stop offset="0.4" stop-color="#C7A15A" stop-opacity="0.8" />
      <stop offset="1" stop-color="#C7A15A" stop-opacity="0" />
